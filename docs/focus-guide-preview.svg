<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="264" viewBox="0 0 1100 264" role="img" aria-labelledby="title desc">
<title id="title">BF focus guide: synthetic state preview</title>
<desc id="desc">Six states rendered by the C guide. White separated pointers indicate near or far adjustment, green aligned pointers indicate confirmed focus, and gray dots indicate missing information. Camera integration is incomplete.</desc>
